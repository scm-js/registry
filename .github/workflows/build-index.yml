# Rebuild index.json from plugins.json and commit it when anything changed.
#
# Hourly, on a push that touches the list or the generator, on demand, and on a
# repository_dispatch — a plugin repository can send one when it publishes, so the
# registry picks the release up without waiting for the hour:
#
#   gh api repos/scm-js/registry/dispatches -f event_type=plugin-updated
name: Build index

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths: ["plugins.json", "scripts/build-index.mjs", ".github/workflows/build-index.yml"]
  repository_dispatch:
    types: [plugin-updated]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Build and push together, retrying on top of whatever landed meanwhile. The
      # concurrency group keeps runs apart, but a scheduled run and a dispatch can still
      # overlap at the edges, and losing the push means the index misses that change until
      # the next hour. Rebuilding rather than rebasing keeps the file a straight function
      # of what the plugins say right now, so the retry cannot commit a stale merge.
      - name: Build and commit index.json
        env:
          # main requires a pull request, and a run's own GITHUB_TOKEN cannot bypass that,
          # so this pushes over SSH with a write deploy key on this repository — which the
          # ruleset names as a bypass actor. A token would have been the obvious thing and
          # does not work: a fine-grained one acts as itself rather than as the person who
          # owns it, so it inherits none of their bypass. Without the secret (a fork) the
          # push falls back to GITHUB_TOKEN.
          CI_BUILD_KEY: ${{ secrets.CI_BUILD_KEY }}
        run: |
          if [ -n "${CI_BUILD_KEY:-}" ]; then
            install -m 700 -d ~/.ssh
            printf '%s\n' "$CI_BUILD_KEY" > ~/.ssh/ci_build
            chmod 600 ~/.ssh/ci_build
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/ci_build -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            git remote set-url origin "git@github.com:$GITHUB_REPOSITORY.git"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            node scripts/build-index.mjs
            if git diff --quiet -- index.json; then
              echo "No change."
              exit 0
            fi
            git add index.json
            git commit -m "Update index.json"
            if git push; then
              exit 0
            fi
            echo "Another run pushed first; rebuilding on top of it (attempt $attempt)."
            git fetch origin main
            git reset --hard origin/main
          done
          echo "::error::Could not push index.json after 3 attempts."
          exit 1
